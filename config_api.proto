syntax = "proto3";
package config_api;
import "nanopb.proto";

//command message sent from application to device
message ConfigTaskCommand {
    oneof command {
        SetOutputDataFormat set_output_data_format = 1;
        SetOutputFrequency set_output_frequency = 2;
        SetOutputMode set_output_mode = 3;
        ConfigureWifiAp configure_wifi_ap = 4;
        ConfigureWifiClient configure_wifi_client = 5;
        ConfigureBle configure_ble = 6;
        GetDiagnostics get_diagnostics = 7;
        GetConfiguration get_configuration = 8;
        ConfigureClientIP configure_client_ip = 9;
        GetAssignedIP get_assigned_ip = 10;
        SetLEDMode set_led_mode = 11;
        SetDataPrefix set_data_prefix = 12;
        SetAccelMode set_accel_mode = 13;
        SetBleTxPower set_ble_tx_power = 14;
        SetWifiMode set_wifi_mode = 15;
        ScanWifi scan_wifi = 16;
    }
}

// response message from device to application
message ConfigTaskResponse {
    oneof response {
        SetOutputDataFormatResponse set_output_data_format_response = 1;
        SetOutputFrequencyResponse set_output_frequency_response = 2;
        SetOutputModeResponse set_output_mode_response = 3;
        ConfigureWifiApResponse configure_wifi_ap_response = 4;
        ConfigureWifiClientResponse configure_wifi_client_response = 5;
        ConfigureBleResponse configure_ble_response = 6;
        GetDiagnosticsResponse get_diagnostics_response = 7;
        GetConfigurationResponse get_configuration_response = 8;
        ConfigureClientIPResponse configure_client_ip_response = 9;
        GetAssignedIPResponse get_assigned_ip_response = 10;
        SetLEDModeResponse set_led_mode_response = 11;
        SetDataPrefixResponse set_data_prefix_response = 12;
        SetAccelModeResponse set_accel_mode_response = 13;
        SetBleTxPowerResponse set_ble_tx_power_response = 14;
        SetWifiModeResponse set_wifi_mode_response = 15;
        ScanWifiResponse scan_wifi_response = 16;
    }
}

//
// device message enums
//

enum TaskState {
    TASK_SUCCESS = 0;
    TASK_FAILURE = 1;
    TASK_REJECTED = 2;
}

enum OutputDataFormat {
    DATA_OSC = 0;
    DATA_JSON = 1;
    DATA_MIDI = 2;
    DATA_ASCII = 3;
}

enum OutputDataMode {
    SERIAL_MODE = 0;
    WIFI_MODE = 1;
    BLE_MODE = 2;
}

enum UsbStatus {
    DISCONNECTED_USB = 0;
    CONNECTED_USB = 1;
}

enum WifiStatus {
    NO_WIFI = 0;
    STA_WIFI = 1;
    AP_WIFI = 2;
}

// Saved Wi-Fi mode used at boot (NVS "wifi_mode"); WifiStatus is the live state,
// which differs after the client-mode fallback to AP.
enum WifiMode {
    WIFI_AP_MODE = 0;
    WIFI_CLIENT_MODE = 1;
}

// Why client mode last failed to join; kept until the next successful join.
enum StaError {
    STA_ERROR_NONE = 0;
    STA_WRONG_PASSWORD = 1;
    STA_NO_AP_FOUND = 2;     // not in range, or a 5 GHz network
    STA_CONNECT_FAILED = 3;
    STA_NO_IP = 4;           // joined, but no address from DHCP yet
}

enum WifiAuth {
    AUTH_OPEN = 0;
    AUTH_PERSONAL = 1;       // WPA/WPA2/WPA3 with a password
    AUTH_ENTERPRISE = 2;     // 802.1X (eduroam...), not supported
    AUTH_OTHER = 3;          // WEP and anything else
}

enum BleStatus {
    DISCONNECTED_BLE = 0;
    BROADCASTING_BLE = 1;
    CONNECTED_BLE = 2;
}

// Which acceleration source is streamed in the 'acc' field of the data output.
// LINEAR_ACCEL (gravity removed, BNO055 fusion output) is the default and
// matches mugic1 behavior; RAW_ACCEL includes the ~9.8 m/s^2 gravity component.
enum AccelMode {
    LINEAR_ACCEL = 0;
    RAW_ACCEL = 1;
}

enum LEDMode {
    NORMAL_LED = 0;
    QUIET_LED = 1;
    ALWAYS_QUIET_LED = 2;
}

enum MaxStringLength {
    // First value must be 0 in proto3.
    UNSPECIFIED_MAX_LENGTH = 0;
    // Unfortunately, we have to repeat these values below :(
    IP_ADDRESS_MAX_STRING_LENGTH = 15;
    SSID_MAX_STRING_LENGTH = 32;
    PASSWORD_MAX_STRING_LENGTH = 63;
    BLE_NAME_MAX_STRING_LENGTH = 10;
    DATA_PREFIX_MAX_STRING_LENGTH = 24;
}

//
// Command messages
//

message SetOutputDataFormat {
    OutputDataFormat output_data_format = 1;
}

message SetOutputFrequency{
    uint32 frequency = 1;
}

message SetOutputMode {
    OutputDataMode output_data_mode = 1;
}

message ConfigureWifiAp {
    string ssid = 1 [(nanopb).max_length = 32];
    string password = 2 [(nanopb).max_length = 63];
    int32 port = 3;
}

message ConfigureWifiClient {
    string ssid = 1 [(nanopb).max_length = 32];
    string password = 2 [(nanopb).max_length = 63];
    int32 port = 3;
}

message ConfigureClientIP {
    string ip0 = 1 [(nanopb).max_length = 15];
    string ip1 = 2 [(nanopb).max_length = 15];
    string ip2 = 3 [(nanopb).max_length = 15];
    string ip3 = 4 [(nanopb).max_length = 15];
    string ip4 = 5 [(nanopb).max_length = 15];
    string ip5 = 6 [(nanopb).max_length = 15];
    string ip6 = 7 [(nanopb).max_length = 15];
    string ip7 = 8 [(nanopb).max_length = 15];
}

message ConfigureBle {
    string ble_name = 1 [(nanopb).max_length = 10];
}

message SetDataPrefix {
    string data_prefix = 1 [(nanopb).max_length = 24];
}

message GetClientIPList {}

message GetDiagnostics {}

message GetConfiguration {}

message GetAssignedIP {}

message SetLEDMode {
  LEDMode led_mode = 1;
}

message SetAccelMode {
  AccelMode accel_mode = 1;
}

// BLE radio TX power in dBm, applied immediately and persisted. Valid range is
// -24..20; the device uses the nearest supported level at or below the value
// (-24, -21, ..., 15, 18, 20). Lower saves battery, higher gives more range.
message SetBleTxPower {
  sint32 tx_power_dbm = 1;
}

// Saves the Wi-Fi mode, like a long press on Mode, and restarts to apply it,
// except in BLE output mode (Wi-Fi is off there; it applies when Wi-Fi is back).
message SetWifiMode {
  WifiMode wifi_mode = 1;
}

// Scans the 2.4 GHz networks MUGIC can see. If ssid is set and seen, that
// network is listed first.
message ScanWifi {
  string ssid = 1 [(nanopb).max_length = 32];
}

//
// Response messages
//

message SetOutputDataFormatResponse {
    TaskState task_state = 1;
}

message SetOutputFrequencyResponse {
    TaskState task_state = 1;
}

message SetOutputModeResponse {
    TaskState task_state = 1;
}

message ConfigureWifiApResponse {
    TaskState task_state = 1;
}

message ConfigureWifiClientResponse {
    TaskState task_state = 1;
}

message ConfigureBleResponse {
    TaskState task_state = 1;
}

message SetDataPrefixResponse {
    TaskState task_state = 1;
}

message GetDiagnosticsResponse {
    uint32 battery_soc = 1;
    float battery_volt = 2;
    uint32 uptime = 3;
    uint32 bno055_readtime = 4;
    uint32 upd_sendtime = 5;
    uint32 data_looptime = 6;
    uint32 udp_err_count = 7;
    WifiStatus wifi_status = 8;
    BleStatus ble_status = 9;
    UsbStatus usb_status = 10;
    string serial_num = 11 [(nanopb).max_length = 16];
    string mac_addr = 12 [(nanopb).max_length = 12];
    LEDMode led_mode = 13;
    StaError sta_error = 14;
}

message GetConfigurationResponse {
    uint32 frequency = 1;
    OutputDataFormat output_data_format = 2;
    OutputDataMode output_data_mode = 3;

    string ap_ssid = 4 [(nanopb).max_length = 32];
    string ap_password = 5 [(nanopb).max_length = 63];
    int32 ap_port = 6;

    string sta_ssid = 7 [(nanopb).max_length = 32];
    string sta_password = 8 [(nanopb).max_length = 63];
    int32 sta_port = 9;

    string ip0 = 10 [(nanopb).max_length = 15];
    string ip1 = 11 [(nanopb).max_length = 15];
    string ip2 = 12 [(nanopb).max_length = 15];
    string ip3 = 13 [(nanopb).max_length = 15];
    string ip4 = 14 [(nanopb).max_length = 15];
    string ip5 = 15 [(nanopb).max_length = 15];
    string ip6 = 16 [(nanopb).max_length = 15];
    string ip7 = 17 [(nanopb).max_length = 15];

    string ble_name = 18 [(nanopb).max_length = 10];

    string data_prefix = 19 [(nanopb).max_length = 24];

    AccelMode accel_mode = 20;

    // Always sent by firmware >= 2.2.1 (even 0 dBm); absent on older firmware.
    sint32 ble_tx_power_dbm = 21 [(nanopb).proto3 = false];

    // Firmware >= 2.3.0; absent on older firmware.
    string firmware_version = 22 [(nanopb).max_length = 31];  // e.g. "2.3.0"
    string firmware_build = 23 [(nanopb).max_length = 39];    // e.g. "2.3.0 (abc1234) [0 commits]"
    WifiMode wifi_mode = 24 [(nanopb).proto3 = false];
}

message ConfigureClientIPResponse {
    TaskState task_state = 1;
}

message GetClientIPListResponse {
    string ip0 = 1 [(nanopb).max_length = 15];
    string ip1 = 2 [(nanopb).max_length = 15];
    string ip2 = 3 [(nanopb).max_length = 15];
    string ip3 = 4 [(nanopb).max_length = 15];
    string ip4 = 5 [(nanopb).max_length = 15];
    string ip5 = 6 [(nanopb).max_length = 15];
    string ip6 = 7 [(nanopb).max_length = 15];
    string ip7 = 8 [(nanopb).max_length = 15];
}

message GetAssignedIPResponse {
    string ip = 1 [(nanopb).max_length = 15];
}

message SetLEDModeResponse {
    TaskState task_state = 1;
}

message SetAccelModeResponse {
    TaskState task_state = 1;
}

message SetBleTxPowerResponse {
    TaskState task_state = 1;
}

message SetWifiModeResponse {
    TaskState task_state = 1;
}

message WifiNetwork {
    string ssid = 1 [(nanopb).max_length = 32];
    sint32 rssi = 2;  // dBm
    WifiAuth auth = 3;
    uint32 channel = 4;
}

// Strongest first, one entry per SSID, trimmed to fit one BLE notification.
message ScanWifiResponse {
    TaskState task_state = 1;
    repeated WifiNetwork networks = 2 [(nanopb).max_count = 8];
}
